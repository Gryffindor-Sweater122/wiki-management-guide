<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Security Check</title>
  <link href="https://fonts.googleapis.com/css2?family=TikTok+Sans:opsz,wght@12..36,300..900&display=swap" rel="stylesheet">
  <script src="https://js.hcaptcha.com/1/api.js" async defer></script>
  <style>
    body {
      font-family: TikTok Sans;
      text-align: center;
      padding-top: 100px;
      background: #f4f4f4;
    }
    .container {
      background: white;
      padding: 30px;
      border-radius: 8px;
      display: inline-block;
      box-shadow: 0 0 10px rgba(0,0,0,0.1);
    }
  </style>
</head>
<body>
  <div class="container">
    <h2>Security Check</h2>
    <p>Please verify you are human to continue for security !</p>
    <div class="h-captcha" 
         data-sitekey="5f8072e8-536e-46a4-a5ac-47f0201c25a0" 
         data-callback="onVerify">
    </div>
    <div class="buttons">
      <a href="https://dragonballz.miraheze.org/" class="btn">Dragon Ball Z Wiki</a>
      <a href="https://github.com/Gryffindor-Sweater122/wiki-management-guide/" class="btn">GitHub</a>
    </div>
  </div>

  <script>
    function onVerify(token) {
      // Store verification in localStorage so user doesn't see it again
      localStorage.setItem("verified", "true");
      // Redirect to homepage
      window.location.href = "index.html";
    }
  </script>
</body>
</html>
